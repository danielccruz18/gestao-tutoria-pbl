<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador PBL - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        #display-timer { font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-sm md:text-base min-h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl flex flex-col gap-4">
            <h1 class="text-2xl font-black text-slate-800 text-center">Bem-vindo à Sessão</h1>
            <p class="text-slate-500 text-center text-sm mb-4">Identifique-se para acessar o painel</p>
            
            <select id="user-select" class="w-full bg-slate-50 border border-slate-300 text-slate-700 rounded-lg p-3 font-bold outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                <option value="">Selecione seu nome...</option>
                <option value="COORDENADOR">👑 SOU O COORDENADOR (Administrador)</option>
            </select>
            
            <button id="btn-entrar" onclick="window.entrar()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-all mt-2">
                Entrar no App
            </button>
        </div>
    </div>

    <!-- TELA DO ALUNO -->
    <div id="student-screen" class="hidden flex-col h-screen max-w-md mx-auto w-full bg-white shadow-xl relative">
        <div class="bg-indigo-600 p-6 text-white rounded-b-3xl shadow-md">
            <h2 class="text-sm font-bold text-indigo-200 uppercase tracking-widest mb-1">Logado como</h2>
            <h1 id="student-name-display" class="text-2xl font-black mb-4">Nome do Aluno</h1>
            <div class="bg-indigo-800/50 rounded-xl p-4 flex flex-col items-center">
                <span class="text-[10px] uppercase font-bold text-indigo-300 tracking-[0.2em] mb-1">Tempo Total</span>
                <div id="student-timer" class="text-3xl font-mono font-black text-white">00:00:00</div>
            </div>
        </div>

        <div class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
            
            <div class="text-center">
                <label for="student-fila-select" class="text-xs uppercase font-bold text-slate-400 mb-1 block">Escolha o Slide (Fila):</label>
                <select id="student-fila-select" onchange="window.mudarFilaAluno(this.value)" class="w-full bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-xl p-3 font-black outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-center text-lg">
                </select>
            </div>
            
            <!-- VISOR DE CRÉDITOS DO ALUNO -->
            <div class="text-center fade-in">
                <span class="text-xs uppercase font-bold text-slate-400">Seus Créditos de Fala:</span>
                <div id="student-creditos-display" class="text-2xl font-black text-indigo-600 mt-1">
                    3 restantes
                </div>
            </div>

            <!-- NOVO BLOCO: VISOR DE TEMPO DE FALA -->
            <div id="bloco-cronometro-fala" class="hidden mb-2 bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 text-center shadow-inner fade-in">
                <h3 class="text-xs uppercase font-bold text-slate-400 tracking-widest mb-2">Seu Tempo de Fala</h3>
                <div id="timer-fala-aluno" class="text-5xl font-mono text-emerald-500 transition-colors duration-300">00:00</div>
            </div>

            <button id="btn-pedir-palavra" onclick="window.pedirPalavra()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-6 rounded-2xl shadow-lg text-lg uppercase transition-all active:scale-95 disabled:bg-slate-300">
                ✋ Pedir a Palavra
            </button>

            <div>
                <h3 class="text-xs uppercase font-bold text-slate-400 mb-2">Fila de inscritos neste slide:</h3>
                <div id="student-fila-lista" class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col gap-2"></div>
            </div>
        </div>
        <button onclick="window.sair()" class="p-4 text-center text-slate-400 text-xs font-bold hover:text-rose-500">Sair da conta</button>
    </div>

    <!-- TELA DO COORDENADOR -->
    <div id="tutor-screen" class="hidden flex-col min-h-screen p-4 md:p-6 relative">
        <header class="max-w-7xl mx-auto w-full mb-6 flex flex-col gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="text-center md:text-left">
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Gestão de Sessão PBL</h1>
                    <p class="text-slate-500 text-sm">Painel do Coordenador <button onclick="window.sair()" class="ml-2 text-indigo-500 hover:underline">Sair</button></p>
                </div>

                <div class="flex flex-col items-center bg-slate-50 border border-slate-200 rounded-xl p-4 min-w-[280px] shadow-inner">
                    <span class="text-[10px] uppercase font-bold text-slate-400 tracking-[0.2em] mb-1">Cronômetro</span>
                    <div id="tutor-timer" class="text-4xl font-mono font-black text-indigo-600 mb-3">00:00:00</div>
                    <div class="flex gap-2 w-full">
                        <button id="btn-iniciar" onclick="window.iniciarTutoria()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase transition-all">Iniciar</button>
                        <button id="btn-terminar" onclick="window.terminarTutoria()" disabled class="flex-1 bg-slate-200 text-slate-400 font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase">Pausar</button>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-2 items-center">
                    <div class="flex items-center gap-2 bg-indigo-50 px-3 py-2 rounded-xl border border-indigo-200 h-full">
                        <label for="input-creditos" class="text-[10px] font-black text-indigo-800 uppercase tracking-widest">Créditos:</label>
                        <input type="number" id="input-creditos" class="w-12 p-1 rounded border border-indigo-300 text-center font-bold text-indigo-700 outline-none" min="1" value="3">
                        <button onclick="window.definirCreditos()" class="bg-indigo-600 text-white text-xs font-bold px-2 py-1.5 rounded hover:bg-indigo-700 transition-all">OK</button>
                    </div>

                    <button onclick="window.zerarTudo()" class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 font-bold py-3 px-4 rounded-xl transition-all text-sm h-full" title="Zerar Sessão">
                        Zerar Sessão
                    </button>
                    <button onclick="window.criarNovaFila()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all text-sm h-full">
                        Novo Slide
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto w-full flex flex-col md:flex-row gap-6 flex-1 md:max-h-[75vh] pb-10 md:pb-0">
            <section class="w-full md:w-5/12 bg-white rounded-2xl shadow-md border border-slate-200 flex flex-col h-[45vh] md:h-full overflow-hidden">
                <div class="p-5 border-b border-slate-200 bg-slate-50">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Lista da Turma</h2>
                    <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl">
                        <label for="fila-alvo-select" class="block text-[10px] font-black text-indigo-800 mb-2 uppercase tracking-widest">Visualizando Fila:</label>
                        <select id="fila-alvo-select" onchange="window.mudarFilaAlvo(this.value)" class="w-full bg-white border border-indigo-200 text-slate-700 rounded-lg p-2.5 text-sm font-bold outline-none"></select>
                    </div>
                </div>
                <div class="p-3 flex-1 overflow-y-auto custom-scroll" id="alunos-container"></div>
            </section>
            
            <section class="w-full md:w-7/12 flex flex-col h-[45vh] md:h-full overflow-y-auto custom-scroll pr-2" id="filas-container"></section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNnAmktPtdI204a_gokCud1gYgNiQ8Wbs",
            authDomain: "tutoria-99cfa.firebaseapp.com",
            databaseURL: "https://tutoria-99cfa-default-rtdb.firebaseio.com",
            projectId: "tutoria-99cfa",
            storageBucket: "tutoria-99cfa.firebasestorage.app",
            messagingSenderId: "852627331176",
            appId: "1:852627331176:web:5c33a7edef97fc75c343dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'pbl-state');

        const alunosListaFixa = [
            { id: 1, nome: "Ákylla Oliveira" }, { id: 2, nome: "Beatriz Benvindo" },
            { id: 3, nome: "Daniel Cardoso" }, { id: 4, nome: "Gustavo Araújo" },
            { id: 5, nome: "Jhennyffer" }, { id: 6, nome: "José Mariel" },
            { id: 7, nome: "Juliana Amaral" }, { id: 8, nome: "Luiz Henrique" },
            { id: 9, nome: "Nathalia Santos" }, { id: 10, nome: "Nívea Veras" },
            { id: 11, nome: "Ricardo Henrique" }, { id: 12, nome: "Sara Maciel" },
            { id: 13, nome: "Victor Marinho" }, { id: 14, nome: "Vitória Grubert" },
            { id: 15, nome: "Yuri Moura" }
        ];

        let state = {
            alunosFalas: {},
            filas: [{ id: "default123", nome: "SLIDE INICIAL", alunosId: [] }],
            filaAlvoId: "default123",
            timer: { ativo: false, segundosAcumulados: 0, startTime: null },
            maxCreditos: 3,
            oradorAtual: null 
        };

        let usuarioAtual = localStorage.getItem('pbl_user');
        let localTimerInterval;
        let alunoFilaSelecionadaId = null;

        function atualizarVisibilidadeTelas() {
            const login = document.getElementById('login-screen');
            const tutor = document.getElementById('tutor-screen');
            const student = document.getElementById('student-screen');

            [login, tutor, student].forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('flex');
            });

            if (!usuarioAtual) {
                login.classList.remove('hidden');
                login.classList.add('flex');
            } else if (usuarioAtual === 'COORDENADOR') {
                tutor.classList.remove('hidden');
                tutor.classList.add('flex');
            } else {
                student.classList.remove('hidden');
                student.classList.add('flex');
            }
        }

        // --- FIREBASE ---
        onValue(dbRef, (snapshot) => {
            if (snapshot.exists()) {
                state = snapshot.val();
                if (!state.filas) state.filas = [];
                state.filas.forEach(f => { if (!f.alunosId) f.alunosId = []; });
                if (!state.alunosFalas) {
                    state.alunosFalas = {};
                    alunosListaFixa.forEach(a => state.alunosFalas[a.id] = 0);
                }
                if (!state.maxCreditos) state.maxCreditos = 3;
                if (state.oradorAtual === undefined) state.oradorAtual = null;
                
                atualizarInterface();
                gerenciarTimerLocal();
            } else {
                set(dbRef, state);
            }
        });

        function sincronizar() { set(dbRef, state); }

        // --- LÓGICA DE USUÁRIO ---
        const userSelect = document.getElementById('user-select');
        alunosListaFixa.sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(a => {
            userSelect.innerHTML += `<option value="${a.id}">${a.nome}</option>`;
        });

        window.entrar = () => {
            const val = document.getElementById('user-select').value;
            if(!val) return alert("Selecione um nome!");
            usuarioAtual = val;
            localStorage.setItem('pbl_user', val);
            atualizarVisibilidadeTelas();
            atualizarInterface();
        };

        window.sair = () => {
            if(confirm("Deseja sair da sua conta?")) {
                usuarioAtual = null;
                localStorage.removeItem('pbl_user');
                atualizarVisibilidadeTelas();
            }
        };

        // --- CRONÔMETRO ---
        function formatarTempo(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return [h, m, sec].map(v => v < 10 ? '0' + v : v).join(':');
        }

        function gerenciarTimerLocal() {
            clearInterval(localTimerInterval);
            const dTut = document.getElementById('tutor-timer');
            const dStd = document.getElementById('student-timer');
            
            const tick = () => {
                // Relógio principal
                let total = state.timer.segundosAcumulados;
                if (state.timer.ativo) {
                    total += Math.floor((Date.now() - state.timer.startTime) / 1000);
                }
                const str = formatarTempo(total);
                if(dTut) dTut.innerText = str;
                if(dStd) dStd.innerText = str;

                // Relógio da fala atual
                if (state.oradorAtual) {
                    const passados = Math.floor((Date.now() - state.oradorAtual.startTime) / 1000);
                    const m = Math.floor(passados / 60);
                    const s = passados % 60;
                    const tempoStr = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

                    // Atualiza visor na tela do Aluno (se for o orador)
                    if (state.oradorAtual.id == usuarioAtual) {
                        const dFala = document.getElementById('timer-fala-aluno');
                        if (dFala) {
                            dFala.innerText = tempoStr;
                            if (passados >= 210) { // 3:30
                                dFala.className = "text-5xl font-mono font-black text-rose-600 transition-colors duration-300";
                            } else {
                                dFala.className = "text-5xl font-mono text-emerald-500 transition-colors duration-300";
                            }
                        }
                    }

                    // Atualiza miniatura no painel do Tutor
                    const dTutorFala = document.getElementById(`tutor-timer-fala-${state.oradorAtual.id}`);
                    if (dTutorFala) {
                        dTutorFala.innerText = tempoStr;
                        if(passados >= 210) dTutorFala.classList.add('text-rose-600');
                    }
                }
            };

            localTimerInterval = setInterval(tick, 1000);
            tick();
        }

        window.iniciarTutoria = () => {
            state.timer.ativo = true;
            state.timer.startTime = Date.now();
            sincronizar();
        };

        window.terminarTutoria = () => {
            if (!state.timer.ativo) return;
            const passados = Math.floor((Date.now() - state.timer.startTime) / 1000);
            state.timer.segundosAcumulados += passados;
            state.timer.ativo = false;
            state.timer.startTime = null;
            sincronizar();
        };

        // --- AÇÕES DO COORDENADOR ---
        window.definirCreditos = () => {
            const novoValor = parseInt(document.getElementById('input-creditos').value);
            if (novoValor > 0) {
                state.maxCreditos = novoValor;
                sincronizar();
            }
        };

        window.criarNovaFila = () => {
            const nome = prompt("Nome do novo slide/tema:");
            if(nome) {
                const id = "fila_" + Date.now();
                state.filas.push({ id, nome, alunosId: [] });
                state.filaAlvoId = id;
                sincronizar();
            }
        };

        window.mudarFilaAlvo = (id) => {
            state.filaAlvoId = id;
            sincronizar();
        };

        window.iniciarFala = (alunoId) => {
            state.oradorAtual = { id: alunoId, startTime: Date.now() };
            sincronizar();
        };

        window.pararFala = () => {
            state.oradorAtual = null;
            sincronizar();
        };

        window.contabilizarFala = (alunoId) => {
            if(!state.alunosFalas[alunoId]) state.alunosFalas[alunoId] = 0;
            state.alunosFalas[alunoId]++;
            
            const fila = state.filas.find(f => f.id === state.filaAlvoId);
            if(fila) {
                fila.alunosId = fila.alunosId.filter(id => id != alunoId);
                
                // Se o aluno que teve a fala contabilizada for o orador atual
                if(state.oradorAtual && state.oradorAtual.id === alunoId) {
                    // Passa para o próximo da fila automaticamente se houver
                    if (fila.alunosId.length > 0) {
                        state.oradorAtual = { id: fila.alunosId[0], startTime: Date.now() };
                    } else {
                        state.oradorAtual = null;
                    }
                }
            }
            sincronizar();
        };

        window.removerDaFila = (alunoId) => {
            const fila = state.filas.find(f => f.id === state.filaAlvoId);
            if(fila) {
                fila.alunosId = fila.alunosId.filter(id => id != alunoId);
                
                if(state.oradorAtual && state.oradorAtual.id === alunoId) {
                    if (fila.alunosId.length > 0) {
                        state.oradorAtual = { id: fila.alunosId[0], startTime: Date.now() };
                    } else {
                        state.oradorAtual = null;
                    }
                }
                sincronizar();
            }
        };

        window.zerarTudo = () => {
            if(confirm("Tem certeza que deseja zerar TODAS as estatísticas e filas?")) {
                state.alunosFalas = {};
                alunosListaFixa.forEach(a => state.alunosFalas[a.id] = 0);
                state.filas = [{ id: "default123", nome: "SLIDE INICIAL", alunosId: [] }];
                state.filaAlvoId = "default123";
                state.timer = { ativo: false, segundosAcumulados: 0, startTime: null };
                state.oradorAtual = null;
                sincronizar();
            }
        };

        // --- AÇÕES DO ALUNO ---
        window.mudarFilaAluno = (id) => {
            alunoFilaSelecionadaId = id;
            renderAluno();
        };

        window.pedirPalavra = () => {
            if(!alunoFilaSelecionadaId) alunoFilaSelecionadaId = state.filas[0]?.id;
            const fila = state.filas.find(f => f.id === alunoFilaSelecionadaId);
            
            if(fila && !fila.alunosId.includes(parseInt(usuarioAtual))) {
                fila.alunosId.push(parseInt(usuarioAtual));
                sincronizar();
            }
        };

        // --- RENDERIZAÇÃO ---
        function atualizarInterface() {
            if (!usuarioAtual) return;
            if (usuarioAtual === 'COORDENADOR') {
                renderTutor();
            } else {
                renderAluno();
            }
        }

        function renderTutor() {
            document.getElementById('input-creditos').value = state.maxCreditos || 3;

            const sel = document.getElementById('fila-alvo-select');
            sel.innerHTML = state.filas.map(f => `<option value="${f.id}" ${f.id===state.filaAlvoId?'selected':''}>${f.nome}</option>`).join('');
            
            const btnIniciar = document.getElementById('btn-iniciar');
            const btnTerminar = document.getElementById('btn-terminar');
            
            if (state.timer.ativo) {
                btnIniciar.disabled = true;
                btnIniciar.className = "flex-1 bg-slate-200 text-slate-400 font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase cursor-not-allowed";
                btnTerminar.disabled = false;
                btnTerminar.className = "flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase transition-all";
            } else {
                btnIniciar.disabled = false;
                btnIniciar.className = "flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase transition-all";
                btnTerminar.disabled = true;
                btnTerminar.className = "flex-1 bg-slate-200 text-slate-400 font-bold py-2 px-3 rounded-lg shadow-sm text-xs uppercase cursor-not-allowed";
            }

            const contAlunos = document.getElementById('alunos-container');
            const filaAtual = state.filas.find(fl => fl.id === state.filaAlvoId);
            
            contAlunos.innerHTML = alunosListaFixa.map(a => {
                const isIn = filaAtual?.alunosId.includes(a.id);
                const falas = state.alunosFalas[a.id] || 0;
                const isOrador = state.oradorAtual && state.oradorAtual.id === a.id;
                
                return `
                    <div class="flex items-center justify-between p-3 mb-2 rounded-xl border ${isOrador ? 'bg-emerald-50 border-emerald-300 ring-2 ring-emerald-400' : (isIn ? 'bg-indigo-50 border-indigo-300' : 'bg-white')}">
                        <span class="font-bold text-slate-700">${a.nome}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-black bg-blue-50 text-blue-600 px-2 py-1 rounded">FALAS: ${falas}/${state.maxCreditos}</span>
                            
                            ${isIn && !isOrador ? `<button onclick="window.iniciarFala(${a.id})" class="bg-blue-500 text-white p-1.5 rounded hover:bg-blue-600" title="Dar a palavra (Iniciar Timer)">🎤</button>` : ''}
                            
                            ${isOrador ? `
                                <span id="tutor-timer-fala-${a.id}" class="text-xs font-mono font-black text-emerald-600 bg-white border border-emerald-200 px-2 py-1.5 rounded">00:00</span>
                                <button onclick="window.pararFala()" class="bg-amber-500 text-white p-1.5 rounded hover:bg-amber-600" title="Pausar Timer">⏸️</button>
                            ` : ''}

                            ${isIn ? `
                                <button onclick="window.contabilizarFala(${a.id})" class="bg-emerald-500 text-white p-1.5 rounded hover:bg-emerald-600" title="Contabilizar e Passar a Palavra">✅</button>
                                <button onclick="window.removerDaFila(${a.id})" class="bg-rose-500 text-white p-1.5 rounded hover:bg-rose-600" title="Remover da fila">❌</button>
                            ` : ''}
                        </div>
                    </div>`;
            }).join('');

            const contFilas = document.getElementById('filas-container');
            contFilas.innerHTML = state.filas.map(f => {
                const alunosFila = f.alunosId.map((id, index) => {
                    const aluno = alunosListaFixa.find(al => al.id === id);
                    const falando = state.oradorAtual && state.oradorAtual.id === id ? '<span class="ml-2 text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full uppercase tracking-wider animate-pulse">Falando</span>' : '';
                    return `<div class="bg-white p-2 border-b last:border-0 text-sm flex justify-between items-center"><span class="font-bold">${index + 1}. ${aluno?.nome} ${falando}</span></div>`;
                }).join('');

                return `
                    <div class="bg-white border rounded-xl mb-4 overflow-hidden shadow-sm">
                        <div class="bg-slate-100 p-3 font-black text-slate-700 border-b flex justify-between">
                            ${f.nome}
                            <span class="bg-indigo-600 text-white text-xs px-2 py-1 rounded">${f.alunosId.length} na fila</span>
                        </div>
                        <div class="flex flex-col">${alunosFila || '<div class="p-4 text-center text-slate-400 text-sm">Fila vazia</div>'}</div>
                    </div>`;
            }).join('');
        }

        function renderAluno() {
            const me = alunosListaFixa.find(a => a.id == usuarioAtual);
            if(me) document.getElementById('student-name-display').innerText = me.nome;

            const sel = document.getElementById('student-fila-select');
            if(!alunoFilaSelecionadaId && state.filas.length > 0) alunoFilaSelecionadaId = state.filas[state.filas.length-1].id;
            
            sel.innerHTML = state.filas.map(f => `<option value="${f.id}" ${f.id===alunoFilaSelecionadaId?'selected':''}>${f.nome}</option>`).join('');

            const filaAt = state.filas.find(f => f.id === alunoFilaSelecionadaId);
            const lista = document.getElementById('student-fila-lista');
            
            if(filaAt && filaAt.alunosId.length > 0) {
                lista.innerHTML = filaAt.alunosId.map((id, idx) => {
                    const al = alunosListaFixa.find(a => a.id == id);
                    const isMe = id == usuarioAtual;
                    const falando = state.oradorAtual && state.oradorAtual.id === id ? '<span class="float-right text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full uppercase tracking-wider">Falando</span>' : '';
                    return `<div class="p-2 rounded ${isMe ? 'bg-indigo-100 font-bold text-indigo-700' : 'bg-white border'}">${idx+1}. ${al?.nome} ${isMe?'(Você)':''} ${falando}</div>`;
                }).join('');
            } else {
                lista.innerHTML = `<div class="text-slate-400 text-center italic text-sm">Ninguém na fila</div>`;
            }

            // Créditos
            const falasUsadas = state.alunosFalas[usuarioAtual] || 0;
            const max = state.maxCreditos || 3;
            const creditosRestantes = max - falasUsadas;
            
            const displayCreditos = document.getElementById('student-creditos-display');
            if (displayCreditos) {
                displayCreditos.innerText = `${creditosRestantes} restantes`;
                if (creditosRestantes <= 0) displayCreditos.className = "text-2xl font-black text-rose-500 mt-1";
                else if (creditosRestantes === 1) displayCreditos.className = "text-2xl font-black text-amber-500 mt-1";
                else displayCreditos.className = "text-2xl font-black text-indigo-600 mt-1";
            }

            // Exibição condicional do bloco de Cronômetro de Fala
            const blocoCronometro = document.getElementById('bloco-cronometro-fala');
            if (state.oradorAtual && state.oradorAtual.id == usuarioAtual) {
                blocoCronometro.classList.remove('hidden');
                blocoCronometro.classList.add('flex', 'flex-col');
            } else {
                blocoCronometro.classList.add('hidden');
                blocoCronometro.classList.remove('flex', 'flex-col');
            }

            // Lógica do botão Pedir a Palavra
            const btnPedir = document.getElementById('btn-pedir-palavra');
            if (btnPedir) {
                const jaNaFila = filaAt?.alunosId.includes(parseInt(usuarioAtual));
                
                if (creditosRestantes <= 0) {
                    btnPedir.disabled = true;
                    btnPedir.className = "w-full bg-slate-300 text-slate-500 font-black py-6 rounded-2xl shadow-inner text-lg uppercase cursor-not-allowed";
                    btnPedir.innerHTML = "🚫 Créditos Esgotados";
                } else if (jaNaFila) {
                    btnPedir.disabled = true;
                    btnPedir.className = "w-full bg-indigo-200 text-indigo-500 font-black py-6 rounded-2xl text-lg uppercase cursor-not-allowed";
                    btnPedir.innerHTML = "✔️ Você já está na fila";
                } else {
                    btnPedir.disabled = false;
                    btnPedir.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-6 rounded-2xl shadow-lg text-lg uppercase transition-all active:scale-95";
                    btnPedir.innerHTML = "✋ Pedir a Palavra";
                }
            }
        }

        atualizarVisibilidadeTelas();
    </script>
</body>
</html>
