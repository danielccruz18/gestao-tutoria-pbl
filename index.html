<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBL Multiplayer — Sem Chat</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .scroll-elegant::-webkit-scrollbar { width: 4px; }
        .scroll-elegant::-webkit-scrollbar-track { background: #e9edf2; border-radius: 20px; }
        .scroll-elegant::-webkit-scrollbar-thumb { background: #b9c4d0; border-radius: 20px; }
        .scroll-elegant::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .fade-in-up {
            animation: fadeInUp 0.25s ease-out;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .timer-digit {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .transition-ease {
            transition: all 0.2s ease-in-out;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-weight: 700;
            border: none;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:active { transform: scale(0.97); }

        .badge-credit {
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 9999px;
            padding: 0.125rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .input-focus:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .orator-card {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 2px solid #34d399;
            box-shadow: 0 8px 24px -6px rgba(52, 211, 153, 0.3);
        }

        @media (max-width: 640px) {
            .glass { backdrop-filter: none; background: white; }
            .btn-primary:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- ========== TELA DE LOGIN ========== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: radial-gradient(ellipse at 30% 20%, #e0e7ff, #c7d2fe, #a5b4fc);">
        <div class="glass rounded-3xl shadow-2xl p-8 max-w-md w-full backdrop-blur-xl border border-white/40">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl text-indigo-600 text-3xl mb-4 shadow-inner">🎓</div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">PBL Multiplayer</h1>
                <p class="text-slate-500 text-sm mt-1 mb-6">Entre na sessão colaborativa</p>
            </div>
            <select id="user-select" class="w-full bg-white/80 border border-slate-200 rounded-xl p-3.5 font-semibold text-slate-700 outline-none input-focus transition shadow-sm">
                <option value="">— Selecione seu nome —</option>
                <option value="COORDENADOR">👑 Coordenador (Admin)</option>
            </select>
            <button id="btn-entrar" onclick="app.entrar()" class="btn-primary w-full mt-5 py-3.5 rounded-xl text-base shadow-lg">
                Entrar na Sessão
            </button>
        </div>
    </div>

    <!-- ========== TELA DO ALUNO ========== -->
    <div id="student-screen" class="hidden flex-col max-w-lg mx-auto w-full bg-white/90 backdrop-blur-sm min-h-[100dvh] shadow-xl relative border-x border-slate-200/50">
        <!-- Cabeçalho -->
        <div class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-800 p-6 text-white rounded-b-[2.5rem] shadow-lg shrink-0">
            <div class="flex items-start justify-between">
                <div>
                    <p class="text-xs font-medium text-indigo-200/80 uppercase tracking-widest">Logado como</p>
                    <h1 id="student-name-display" class="text-2xl font-black mt-0.5 tracking-tight">Aluno</h1>
                </div>
                <div class="bg-white/20 backdrop-blur-sm rounded-xl px-4 py-2 text-center shadow-inner">
                    <span class="text-[10px] uppercase font-bold text-indigo-200/80 tracking-[0.15em]">Tempo</span>
                    <div id="student-timer" class="timer-digit text-2xl font-mono font-black">00:00:00</div>
                </div>
            </div>
        </div>

        <!-- Conteúdo -->
        <div class="flex-1 p-5 overflow-y-auto scroll-elegant space-y-5">

            <!-- Selecionar slide -->
            <div class="bg-slate-50/80 rounded-2xl p-4 border border-slate-200/60 shadow-sm">
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">📌 Slide ativo</label>
                <select id="student-fila-select" onchange="app.alunoMudarFila(this.value)" class="w-full bg-white border border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none input-focus transition text-center">
                </select>
            </div>

            <!-- Créditos -->
            <div class="bg-gradient-to-br from-indigo-50 to-indigo-100/50 rounded-2xl p-5 text-center border border-indigo-200/60 shadow-sm">
                <span class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider">🎯 Créditos de fala</span>
                <div id="student-creditos-display" class="text-4xl font-black text-indigo-600 mt-0.5">3 restantes</div>
            </div>

            <!-- Bloco de fala ativa -->
            <div id="bloco-cronometro-fala" class="hidden orator-card rounded-2xl p-5 text-center fade-in-up">
                <h3 class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider">🎤 Falando agora</h3>
                <h2 id="nome-orador-aluno" class="text-xl font-black text-slate-800 mt-1 truncate">...</h2>
                <div id="timer-fala-aluno" class="timer-digit text-5xl font-mono font-black text-emerald-500 transition-colors duration-300">00:00</div>
                <button id="btn-finalizar-fala-aluno" onclick="app.alunoConcluirFala()" class="hidden mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-sm uppercase tracking-wider transition-ease active:scale-95">
                    ✅ Concluir minha fala
                </button>
            </div>

            <!-- Botão principal -->
            <button id="btn-pedir-palavra" class="w-full font-black py-5 rounded-2xl shadow-lg text-lg uppercase transition-ease active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                ✋ Pedir a Palavra
            </button>

            <!-- Fila -->
            <div>
                <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">⏳ Fila de espera</h3>
                <div id="student-fila-lista" class="bg-slate-50/80 border border-slate-200/60 rounded-2xl p-3 space-y-2 min-h-[80px] shadow-sm"></div>
            </div>

        </div>

        <!-- Sair -->
        <button onclick="app.sair()" class="p-4 text-center text-slate-400 text-xs font-bold hover:text-rose-500 bg-white/80 border-t border-slate-200/60 transition-ease shrink-0">Sair da conta</button>
    </div>

    <!-- ========== TELA DO COORDENADOR ========== -->
    <div id="tutor-screen" class="hidden flex-col min-h-screen p-4 md:p-6 bg-slate-100/80">
        <!-- Header -->
        <header class="max-w-7xl mx-auto w-full glass rounded-3xl shadow-lg border border-white/40 p-6 mb-6 backdrop-blur-xl">
            <div class="flex flex-col lg:flex-row lg:items-center gap-4">

                <div class="flex-1">
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-600 p-2 rounded-xl text-xl">📋</span>
                        Gestão PBL
                    </h1>
                    <p class="text-sm text-slate-500">Coordenador <button onclick="app.sair()" class="ml-2 text-indigo-500 hover:text-indigo-700 font-medium transition-ease">Sair</button></p>
                </div>

                <!-- Orador ativo -->
                <div id="bloco-orador-tutor" class="hidden orator-card rounded-2xl p-4 min-w-[200px] shadow-md fade-in-up flex-col items-center">
                    <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">🎤 Falando: <span id="nome-orador-tutor" class="font-black"></span></span>
                    <div id="timer-orador-tutor" class="timer-digit text-5xl font-mono font-black text-emerald-500 transition-colors duration-300">00:00</div>
                    <button onclick="app.pararFala()" class="mt-2 w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-xl shadow-sm uppercase tracking-wider transition-ease">⏸️ Interromper</button>
                </div>

                <!-- Cronômetro Global -->
                <div class="bg-white/70 backdrop-blur-sm border border-slate-200/60 rounded-2xl p-4 min-w-[180px] shadow-inner flex flex-col items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">⏱️ Cronômetro</span>
                    <div id="tutor-timer" class="timer-digit text-3xl font-mono font-black text-indigo-600">00:00:00</div>
                    <div class="flex gap-2 w-full mt-2">
                        <button id="btn-iniciar" onclick="app.iniciarTutoria()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase transition-ease">Iniciar</button>
                        <button id="btn-terminar" onclick="app.terminarTutoria()" disabled class="flex-1 bg-slate-200 text-slate-400 font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase transition-ease cursor-not-allowed">Pausar</button>
                    </div>
                </div>

                <!-- Ações -->
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-1 bg-indigo-50/80 px-3 py-2 rounded-xl border border-indigo-200/60 backdrop-blur-sm">
                        <label class="text-[10px] font-bold text-indigo-800 uppercase tracking-widest">Créditos:</label>
                        <input type="number" id="input-creditos" class="w-12 p-1.5 rounded-xl border border-indigo-200/60 text-center font-bold text-indigo-700 outline-none input-focus transition bg-white/70" min="1" value="3" />
                        <button onclick="app.definirCreditos()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition-ease">OK</button>
                    </div>
                    <button onclick="app.zerarTudo()" class="bg-rose-50/80 hover:bg-rose-100/80 border border-rose-200/60 text-rose-600 font-bold px-4 py-2 rounded-xl transition-ease text-sm backdrop-blur-sm">🔄 Zerar</button>
                    <button onclick="app.criarNovaFila()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl shadow-md transition-ease text-sm">➕ Novo Slide</button>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="max-w-7xl mx-auto w-full flex flex-col lg:flex-row gap-6 flex-1">

            <!-- Lista de alunos -->
            <section class="w-full lg:w-5/12 glass rounded-3xl shadow-lg border border-white/40 flex flex-col max-h-[70vh] overflow-hidden backdrop-blur-xl">
                <div class="p-5 border-b border-slate-200/60 shrink-0">
                    <h2 class="text-xl font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-xl text-sm">👥</span>
                        Turma
                    </h2>
                    <div class="bg-indigo-50/80 border border-indigo-200/60 p-3 rounded-xl">
                        <label class="block text-[10px] font-bold text-indigo-800 uppercase tracking-widest mb-1">Visualizando Fila:</label>
                        <select id="fila-alvo-select" onchange="app.coordenadorMudarFila(this.value)" class="w-full bg-white/70 border border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none input-focus transition"></select>
                    </div>
                </div>
                <div id="alunos-container" class="flex-1 p-3 overflow-y-auto scroll-elegant space-y-2"></div>
            </section>

            <!-- Lista de todas as filas -->
            <section class="w-full lg:w-7/12 flex flex-col gap-4 overflow-y-auto scroll-elegant pr-1 max-h-[70vh]">
                <div id="filas-container" class="space-y-3"></div>
            </section>
        </main>
    </div>

    <!-- ========== SCRIPT (sem chat) ========== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNnAmktPtdI204a_gokCud1gYgNiQ8Wbs",
            authDomain: "tutoria-99cfa.firebaseapp.com",
            databaseURL: "https://tutoria-99cfa-default-rtdb.firebaseio.com",
            projectId: "tutoria-99cfa",
            storageBucket: "tutoria-99cfa.firebasestorage.app",
            messagingSenderId: "852627331176",
            appId: "1:852627331176:web:5c33a7edef97fc75c343dd"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const db = getDatabase(appFirebase);
        const dbRef = ref(db, 'pbl-state-remake');

        const ALUNOS = [
            { id: 1, nome: "Ákylla Oliveira" },
            { id: 2, nome: "Beatriz Benvindo" },
            { id: 3, nome: "Daniel Cardoso" },
            { id: 4, nome: "Gustavo Araújo" },
            { id: 5, nome: "Jhennyffer" },
            { id: 6, nome: "José Mariel" },
            { id: 7, nome: "Juliana Amaral" },
            { id: 8, nome: "Luiz Henrique" },
            { id: 9, nome: "Nathalia Santos" },
            { id: 10, nome: "Nívea Veras" },
            { id: 11, nome: "Ricardo Henrique" },
            { id: 12, nome: "Sara Maciel" },
            { id: 13, nome: "Victor Marinho" },
            { id: 14, nome: "Vitória Grubert" },
            { id: 15, nome: "Yuri Moura" }
        ].sort((a, b) => a.nome.localeCompare(b.nome));

        const estadoPadrao = {
            filas: [{ id: "default", nome: "SLIDE INICIAL", alunosId: [] }],
            filaAlvoId: "default",
            timer: { ativo: false, segundosAcumulados: 0, startTime: null },
            maxCreditos: 3,
            oradorAtual: null,
            alunosFalas: {}
        };

        class App {
            constructor() {
                this.state = JSON.parse(JSON.stringify(estadoPadrao));
                this.usuarioAtual = localStorage.getItem('pbl_user_remake') || null;
                this.alunoFilaSelecionadaId = null;
                this.dadosCarregados = false;
                this.intervaloTimer = null;

                this.els = {
                    loginScreen: document.getElementById('login-screen'),
                    studentScreen: document.getElementById('student-screen'),
                    tutorScreen: document.getElementById('tutor-screen'),
                    userSelect: document.getElementById('user-select'),
                };

                ALUNOS.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.nome;
                    this.els.userSelect.appendChild(opt);
                });

                this.iniciarEscuta();
                this.atualizarVisibilidade();
            }

            // ----- Firebase -----
            iniciarEscuta() {
                onValue(dbRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        this.state = this.mergeEstado(data);
                        this.dadosCarregados = true;
                        this.atualizarTudo();
                    } else {
                        this.state = JSON.parse(JSON.stringify(estadoPadrao));
                        ALUNOS.forEach(a => this.state.alunosFalas[a.id] = 0);
                        this.dadosCarregados = true;
                        this.sincronizar();
                        this.atualizarTudo();
                    }
                });
            }

            mergeEstado(data) {
                const base = JSON.parse(JSON.stringify(estadoPadrao));
                const merged = { ...base, ...data };
                merged.filas = merged.filas || base.filas;
                merged.filas.forEach(f => { if (!f.alunosId) f.alunosId = []; });
                merged.alunosFalas = merged.alunosFalas || {};
                merged.timer = merged.timer || base.timer;
                return merged;
            }

            sincronizar() {
                if (!this.dadosCarregados) return;
                const dadosParaEnviar = {
                    filas: this.state.filas,
                    filaAlvoId: this.state.filaAlvoId,
                    timer: {
                        ativo: this.state.timer.ativo,
                        segundosAcumulados: this.state.timer.segundosAcumulados,
                        startTime: null
                    },
                    maxCreditos: this.state.maxCreditos,
                    oradorAtual: this.state.oradorAtual,
                    alunosFalas: this.state.alunosFalas
                };
                set(dbRef, dadosParaEnviar);
            }

            // ----- Usuário -----
            entrar() {
                const val = this.els.userSelect.value;
                if (!val) return alert('Selecione um nome!');
                this.usuarioAtual = val;
                localStorage.setItem('pbl_user_remake', val);
                this.atualizarVisibilidade();
                this.atualizarTudo();
            }

            sair() {
                if (!confirm('Deseja sair da sua conta?')) return;
                this.usuarioAtual = null;
                localStorage.removeItem('pbl_user_remake');
                this.atualizarVisibilidade();
                if (this.intervaloTimer) {
                    clearInterval(this.intervaloTimer);
                    this.intervaloTimer = null;
                }
            }

            atualizarVisibilidade() {
                const { loginScreen, studentScreen, tutorScreen } = this.els;
                [loginScreen, studentScreen, tutorScreen].forEach(el => {
                    el.classList.add('hidden');
                    el.classList.remove('flex', 'flex-col');
                });
                if (!this.usuarioAtual) {
                    loginScreen.classList.remove('hidden');
                    loginScreen.classList.add('flex');
                } else if (this.usuarioAtual === 'COORDENADOR') {
                    tutorScreen.classList.remove('hidden');
                    tutorScreen.classList.add('flex', 'flex-col');
                } else {
                    studentScreen.classList.remove('hidden');
                    studentScreen.classList.add('flex', 'flex-col');
                }
            }

            // ----- Timer -----
            formatarTempo(s) {
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const seg = s % 60;
                return [h, m, seg].map(v => String(v).padStart(2, '0')).join(':');
            }
            formatarTempoMinSeg(s) {
                const m = Math.floor(s / 60);
                const seg = s % 60;
                return `${String(m).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
            }

            gerenciarTimerLocal() {
                if (this.intervaloTimer) clearInterval(this.intervaloTimer);
                const tick = () => {
                    let total = this.state.timer.segundosAcumulados;
                    if (this.state.timer.ativo && this.state.timer.startTime) {
                        total += Math.floor((Date.now() - this.state.timer.startTime) / 1000);
                    }
                    const str = this.formatarTempo(total);
                    document.querySelectorAll('.timer-global').forEach(el => el.textContent = str);

                    if (this.state.oradorAtual) {
                        const passados = Math.floor((Date.now() - this.state.oradorAtual.startTime) / 1000);
                        const strFala = this.formatarTempoMinSeg(passados);
                        const isAlert = passados >= 210;
                        document.querySelectorAll('.timer-fala').forEach(el => {
                            el.textContent = strFala;
                            if (isAlert) {
                                el.classList.remove('text-emerald-500', 'text-emerald-600');
                                el.classList.add('text-rose-600');
                            } else {
                                el.classList.remove('text-rose-600');
                                el.classList.add('text-emerald-500', 'text-emerald-600');
                            }
                        });
                    }
                };
                this.intervaloTimer = setInterval(tick, 1000);
                tick();
            }

            // ----- Ações Coordenador -----
            coordenadorMudarFila(id) {
                this.state.filaAlvoId = id;
                this.sincronizar();
                this.renderizarCoordenador();
            }
            definirCreditos() {
                const val = parseInt(document.getElementById('input-creditos').value);
                if (val > 0) { this.state.maxCreditos = val;
                    this.sincronizar(); }
            }
            criarNovaFila() {
                const nome = prompt('Nome do novo slide:');
                if (nome) {
                    const id = 'fila_' + Date.now();
                    this.state.filas.push({ id, nome, alunosId: [] });
                    this.state.filaAlvoId = id;
                    this.sincronizar();
                }
            }
            removerFila(id) {
                if (this.state.filas.length <= 1) return alert('Mantenha pelo menos um slide.');
                if (!confirm('Excluir este slide?')) return;
                this.state.filas = this.state.filas.filter(f => f.id !== id);
                if (this.state.filaAlvoId === id) this.state.filaAlvoId = this.state.filas[0].id;
                this.sincronizar();
            }
            iniciarFala(alunoId) {
                const fila = this.state.filas.find(f => f.id === this.state.filaAlvoId);
                if (!fila || !fila.alunosId.includes(alunoId)) return alert('Aluno não está na fila.');
                if (this.state.oradorAtual) this.contabilizarFala(this.state.oradorAtual.id, true);
                this.state.oradorAtual = { id: alunoId, startTime: Date.now() };
                this.sincronizar();
            }
            pararFala() {
                if (this.state.oradorAtual) { this.state.oradorAtual = null;
                    this.sincronizar(); }
            }
            contabilizarFala(alunoId, remover = true) {
                if (!this.state.alunosFalas[alunoId]) this.state.alunosFalas[alunoId] = 0;
                this.state.alunosFalas[alunoId]++;
                if (remover) {
                    this.state.filas.forEach(f => f.alunosId = f.alunosId.filter(id => id !== alunoId));
                }
                if (this.state.oradorAtual && this.state.oradorAtual.id === alunoId) this.state.oradorAtual = null;
                this.sincronizar();
            }
            removerDaFila(alunoId) {
                this.state.filas.forEach(f => f.alunosId = f.alunosId.filter(id => id !== alunoId));
                if (this.state.oradorAtual && this.state.oradorAtual.id === alunoId) this.state.oradorAtual = null;
                this.sincronizar();
            }
            zerarTudo() {
                if (!confirm('Zerar todas as estatísticas, filas e cronômetro?')) return;
                this.state = JSON.parse(JSON.stringify(estadoPadrao));
                ALUNOS.forEach(a => this.state.alunosFalas[a.id] = 0);
                this.state.filas = [{ id: "default", nome: "SLIDE INICIAL", alunosId: [] }];
                this.state.filaAlvoId = "default";
                this.state.timer = { ativo: false, segundosAcumulados: 0, startTime: null };
                this.state.oradorAtual = null;
                this.sincronizar();
            }
            iniciarTutoria() {
                this.state.timer.ativo = true;
                this.state.timer.startTime = Date.now();
                this.sincronizar();
            }
            terminarTutoria() {
                if (!this.state.timer.ativo) return;
                const passados = Math.floor((Date.now() - this.state.timer.startTime) / 1000);
                this.state.timer.segundosAcumulados += passados;
                this.state.timer.ativo = false;
                this.state.timer.startTime = null;
                this.sincronizar();
            }

            // ----- Ações Aluno -----
            alunoMudarFila(id) { this.alunoFilaSelecionadaId = id;
                this.renderizarAluno(); }
            pedirPalavra() {
                const idInt = parseInt(this.usuarioAtual);
                if (this.state.filas.some(f => f.alunosId.includes(idInt))) return alert('Você já está na fila.');
                if ((this.state.alunosFalas[idInt] || 0) >= this.state.maxCreditos) return alert('Créditos esgotados.');
                if (!this.alunoFilaSelecionadaId) {
                    if (this.state.filas.length > 0) this.alunoFilaSelecionadaId = this.state.filas[0].id;
                    else return alert('Nenhum slide disponível.');
                }
                const fila = this.state.filas.find(f => f.id === this.alunoFilaSelecionadaId);
                if (!fila) return;
                if (!fila.alunosId.includes(idInt)) { fila.alunosId.push(idInt);
                    this.sincronizar(); }
            }
            sairDaFila() {
                const idInt = parseInt(this.usuarioAtual);
                this.state.filas.forEach(f => f.alunosId = f.alunosId.filter(id => id !== idInt));
                if (this.state.oradorAtual && this.state.oradorAtual.id === idInt) this.state.oradorAtual = null;
                this.sincronizar();
            }
            alunoConcluirFala() {
                const idInt = parseInt(this.usuarioAtual);
                if (this.state.oradorAtual && this.state.oradorAtual.id === idInt) this.contabilizarFala(idInt, true);
            }

            // ----- Renderização -----
            renderizarCoordenador() {
                const el = document.getElementById('input-creditos');
                if (el) el.value = this.state.maxCreditos || 3;

                const bloco = document.getElementById('bloco-orador-tutor');
                if (this.state.oradorAtual) {
                    bloco.classList.remove('hidden');
                    bloco.classList.add('flex', 'flex-col');
                    const aluno = ALUNOS.find(a => a.id === this.state.oradorAtual.id);
                    document.getElementById('nome-orador-tutor').textContent = aluno ? aluno.nome : 'Desconhecido';
                } else {
                    bloco.classList.add('hidden');
                    bloco.classList.remove('flex', 'flex-col');
                }

                const selFila = document.getElementById('fila-alvo-select');
                selFila.innerHTML = this.state.filas.map(f =>
                    `<option value="${f.id}" ${f.id === this.state.filaAlvoId ? 'selected' : ''}>${f.nome}</option>`
                ).join('');

                const btnIni = document.getElementById('btn-iniciar');
                const btnPar = document.getElementById('btn-terminar');
                if (this.state.timer.ativo) {
                    btnIni.disabled = true;
                    btnIni.className = 'flex-1 bg-slate-200 text-slate-400 font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase cursor-not-allowed';
                    btnPar.disabled = false;
                    btnPar.className = 'flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase transition-ease';
                } else {
                    btnIni.disabled = false;
                    btnIni.className = 'flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase transition-ease';
                    btnPar.disabled = true;
                    btnPar.className = 'flex-1 bg-slate-200 text-slate-400 font-bold py-1.5 rounded-xl shadow-sm text-xs uppercase cursor-not-allowed';
                }

                const container = document.getElementById('alunos-container');
                const filaAtual = this.state.filas.find(f => f.id === this.state.filaAlvoId);
                if (!filaAtual) { container.innerHTML =
                    '<p class="text-slate-400 text-sm text-center py-4">Selecione uma fila.</p>'; return; }

                container.innerHTML = ALUNOS.map(a => {
                    const isIn = filaAtual.alunosId.includes(a.id);
                    const isOrador = this.state.oradorAtual && this.state.oradorAtual.id === a.id;
                    const falas = this.state.alunosFalas[a.id] || 0;
                    const creditosRestantes = this.state.maxCreditos - falas;

                    let botoes = '';
                    if (isIn && !isOrador) {
                        botoes +=
                            `<button onclick="app.iniciarFala(${a.id})" class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded-xl shadow-sm transition-ease" title="Dar a palavra">🎤</button>`;
                    }
                    if (isOrador) {
                        botoes +=
                            `<span class="timer-fala text-xs font-mono font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded-xl">00:00</span>`;
                    }
                    if (isIn) {
                        botoes +=
                            `<button onclick="app.contabilizarFala(${a.id}, true)" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-2 py-1 rounded-xl shadow-sm transition-ease" title="Contabilizar e passar">✅</button>`;
                        botoes +=
                            `<button onclick="app.removerDaFila(${a.id})" class="bg-rose-500 hover:bg-rose-600 text-white text-xs px-2 py-1 rounded-xl shadow-sm transition-ease" title="Remover da fila">❌</button>`;
                    }

                    const corBg = isOrador ? 'bg-emerald-50/80 border-emerald-300 ring-2 ring-emerald-200' :
                        isIn ? 'bg-indigo-50/80 border-indigo-200' : 'bg-white/70';

                    return `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${corBg} fade-in-up backdrop-blur-sm">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm">${a.nome}</span>
                                    <span class="badge-credit">${falas}/${this.state.maxCreditos}</span>
                                    ${creditosRestantes <= 0 ? '<span class="text-xs text-rose-500">🚫</span>' : ''}
                                </div>
                                <div class="flex items-center gap-1.5 flex-wrap">${botoes}</div>
                            </div>
                        `;
                }).join('');

                const containerFilas = document.getElementById('filas-container');
                containerFilas.innerHTML = this.state.filas.map(f => {
                    const alunosNaFila = f.alunosId.map(id => {
                        const aluno = ALUNOS.find(a => a.id === id);
                        const isOrador = this.state.oradorAtual && this.state.oradorAtual.id === id;
                        const nome = aluno ? aluno.nome : 'Desconhecido';
                        return `<div class="flex justify-between items-center p-2.5 border-b last:border-0 text-sm">
                                    <span>${nome} ${isOrador ? '🎤' : ''}</span>
                                    ${isOrador ? `<span class="timer-fala text-xs font-mono font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-xl">00:00</span>` : ''}
                                </div>`;
                    }).join('');

                    return `
                            <div class="bg-white/70 backdrop-blur-sm border border-slate-200/60 rounded-2xl overflow-hidden shadow-sm">
                                <div class="bg-slate-50/80 px-4 py-2.5 font-bold text-slate-700 border-b border-slate-200/60 flex justify-between items-center">
                                    <span>${f.nome} <span class="badge-credit">${f.alunosId.length}</span></span>
                                    <button onclick="app.removerFila('${f.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold transition-ease">🗑️</button>
                                </div>
                                <div class="p-2 ${f.alunosId.length === 0 ? 'text-center text-slate-400 text-sm py-4' : ''}">
                                    ${f.alunosId.length > 0 ? alunosNaFila : 'Fila vazia'}
                                </div>
                            </div>
                        `;
                }).join('');
            }

            renderizarAluno() {
                const me = ALUNOS.find(a => a.id == this.usuarioAtual);
                if (me) document.getElementById('student-name-display').textContent = me.nome;

                if (!this.alunoFilaSelecionadaId || !this.state.filas.some(f => f.id === this.alunoFilaSelecionadaId)) {
                    if (this.state.filas.length > 0) this.alunoFilaSelecionadaId = this.state.filas[this.state.filas.length -
                    1].id;
                    else this.alunoFilaSelecionadaId = null;
                }

                const sel = document.getElementById('student-fila-select');
                sel.innerHTML = this.state.filas.map(f =>
                    `<option value="${f.id}" ${f.id === this.alunoFilaSelecionadaId ? 'selected' : ''}>${f.nome}</option>`
                ).join('');

                const falasUsadas = this.state.alunosFalas[this.usuarioAtual] || 0;
                const max = this.state.maxCreditos || 3;
                const restantes = max - falasUsadas;
                const display = document.getElementById('student-creditos-display');
                display.textContent = `${restantes} restante${restantes !== 1 ? 's' : ''}`;
                display.className = 'text-4xl font-black mt-0.5 ' +
                    (restantes <= 0 ? 'text-rose-500' : restantes === 1 ? 'text-amber-500' : 'text-indigo-600');

                const filaAtual = this.state.filas.find(f => f.id === this.alunoFilaSelecionadaId);
                const lista = document.getElementById('student-fila-lista');
                if (filaAtual && filaAtual.alunosId.length > 0) {
                    lista.innerHTML = filaAtual.alunosId.map((id, idx) => {
                        const al = ALUNOS.find(a => a.id === id);
                        const isMe = id == this.usuarioAtual;
                        const isOrador = this.state.oradorAtual && this.state.oradorAtual.id === id;
                        let acao = '';
                        if (isMe && !isOrador) {
                            const podeIniciar = idx === 0 && !this.state.oradorAtual;
                            if (podeIniciar) {
                                acao =
                                    `<button onclick="app.iniciarFala(${id})" class="ml-2 bg-blue-500 hover:bg-blue-600 text-white text-[10px] px-2 py-1 rounded-xl shadow-sm">🎤 Iniciar</button>`;
                            } else {
                                acao =
                                    `<span class="ml-2 text-[9px] text-slate-400 font-bold uppercase">Aguarde</span>`;
                            }
                        }
                        const falando = isOrador ?
                            `<span class="timer-fala ml-2 inline-block font-mono font-black bg-emerald-100 border border-emerald-300 text-emerald-700 px-2 py-0.5 rounded-xl text-[10px]">00:00</span>` :
                            '';
                        return `
                                <div class="p-2.5 rounded-xl flex justify-between items-center ${isMe ? 'bg-indigo-100 font-bold text-indigo-700 border border-indigo-200' : 'bg-white/70 border border-slate-200/60'}">
                                    <div class="truncate text-sm">${idx+1}. ${al?.nome} ${isMe ? '(Você)' : ''} ${falando}</div>
                                    ${acao}
                                </div>
                            `;
                    }).join('');
                } else {
                    lista.innerHTML =
                    '<div class="text-slate-400 text-center italic text-sm p-2">Ninguém na fila</div>';
                }

                const bloco = document.getElementById('bloco-cronometro-fala');
                const nomeOrador = document.getElementById('nome-orador-aluno');
                const btnFinalizar = document.getElementById('btn-finalizar-fala-aluno');
                if (this.state.oradorAtual) {
                    bloco.classList.remove('hidden');
                    bloco.classList.add('flex', 'flex-col');
                    const orador = ALUNOS.find(a => a.id === this.state.oradorAtual.id);
                    nomeOrador.textContent = orador ? (orador.id == this.usuarioAtual ? 'VOCÊ' : orador.nome) :
                    'Desconhecido';
                    btnFinalizar.classList.toggle('hidden', this.state.oradorAtual.id != this.usuarioAtual);
                } else {
                    bloco.classList.add('hidden');
                    bloco.classList.remove('flex', 'flex-col');
                }

                const btn = document.getElementById('btn-pedir-palavra');
                const idInt = parseInt(this.usuarioAtual);
                const emFila = this.state.filas.some(f => f.alunosId.includes(idInt));
                const creditosRestantesAluno = max - falasUsadas;

                if (creditosRestantesAluno <= 0) {
                    btn.disabled = true;
                    btn.className =
                        'w-full bg-slate-200/80 text-slate-400 font-black py-5 rounded-2xl shadow-inner text-lg uppercase cursor-not-allowed';
                    btn.textContent = '🚫 Créditos esgotados';
                } else if (emFila) {
                    btn.disabled = false;
                    btn.onclick = () => this.sairDaFila();
                    btn.className =
                        'w-full bg-rose-500 hover:bg-rose-600 text-white font-black py-5 rounded-2xl shadow-lg text-sm uppercase transition-ease active:scale-95';
                    btn.textContent = '❌ Sair da fila';
                } else {
                    btn.disabled = false;
                    btn.onclick = () => this.pedirPalavra();
                    btn.className =
                        'w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-5 rounded-2xl shadow-lg text-lg uppercase transition-ease active:scale-95';
                    btn.textContent = '✋ Pedir a Palavra';
                }
            }

            atualizarTudo() {
                if (!this.usuarioAtual) return;
                if (this.usuarioAtual === 'COORDENADOR') {
                    this.renderizarCoordenador();
                } else {
                    this.renderizarAluno();
                }
                this.gerenciarTimerLocal();
            }
        }

        const app = new App();
        window.app = app;
        document.getElementById('btn-entrar').onclick = () => app.entrar();
        console.log('✅ App sem chat carregado!');
    </script>
</body>
</html>
